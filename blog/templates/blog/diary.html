{% extends "blog/base.html" %}
{% block body %}

<link rel="stylesheet" type="text/css" href="/static/diary.css">



<title>更新画面</title>

<form action="/blog/diaryupdate" method="post" enctype="multipart/form-data">

    <div id="main">
        <input id="ID" type="text" name="ID" value="{{diary.id}}">
        
        
        <label class="label">ツッコミ</label>
        <br>
        <textarea rows="12" cols="100" name="comment">{{diary.comment}}</textarea>
        <div class="time">{{diary.date.strftime("%Y/%m/%d %H:%M")}}</div>

        {% if name == diary.user %}
        <input class="btn1" type="submit" value="  更  新  ">
        <button class="btn1" id="btn2" type="button" onclick="location.href='/blog/delete/{{diary.id}}'">  削  除  </button>
        {% endif %}
    </div>

    <div class="post-container">
        {% for post in posts %}
        <div class="post" id="post-{{ post.id }}">
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
            <button class="like-button" id="likeButton-{{ post.id }}">
                <span class="heart">❤️</span> いいね
            </button>
            <div class="like-count" id="likeCount-{{ post.id }}">{{ post.like_count }}</div>
        </div>
        {% endfor %}
    </div>
</form>

    <script>
        // 投稿ごとにいいねボタンのクリックを処理
        document.querySelectorAll('.like-button').forEach(button => {
            button.addEventListener('click', function () {
                const postId = this.id.replace('likeButton-', '');  // 投稿IDを取得
    
                // いいねをサーバーに送信
                fetch(`/like/${postId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                })
                .then(response => response.json())
                .then(data => {
                    const likeCount = document.getElementById(`likeCount-${postId}`);
                    likeCount.textContent = data.like_count;  // 更新されたいいね数を表示
                })
                .catch(error => console.error('Error:', error));
            });
        });
    </script>

{% endblock %}
