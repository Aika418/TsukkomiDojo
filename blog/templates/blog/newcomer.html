<!DOCTYPE html>
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" type="text/css" href="/static/newcomer.css">


<title>新規登録画面</title>

<div class="frame">
    <img src="/static/loginnoimage.PNG">
    <h2>アカウントを作成</h2>
    {% if status == "exist_user" %}
    <p>そのユーザーは既に登録されています。</p>
    {% elif status == None %}
    <p>ユーザ名を入力してください。</p>
    {% endif %}
    <form action="/blog/registar" method="post">
        <div class="box1">
            <label for="text1" id="l_text1">ユーザー名</label>
            <input id="text1" type="text" name="user_name" placeholder="ユーザー名">
        </div>
        <div class="box1">
            <label for="text2" id="l_text2">パスワード</label>
            <input id="text2" type="password" name="password" placeholder="パスワード">
        </div>
        
        
        <button class="btn1" type="submit">登録する</button>
    </form>
    <p>
      <br>
      <a href="/blog/top">ログイン画面に戻る</a>
    </p>
</div>
